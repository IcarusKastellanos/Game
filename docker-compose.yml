services:
  postgres:
    # PG 18 — matches dumps from recent Homebrew / local Postgres installs
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: witchcraft_sim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d witchcraft_sim"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
