name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint (typecheck)
        run: npm run lint

      - name: Shared unit tests
        run: npm run test -w shared

      - name: Validate NPC content
        run: npm run content:validate-npc

      - name: Build
        run: npm run build
